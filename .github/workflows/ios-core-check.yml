# Concord iOS — core staticlib check (NEW; does not replace ios.yml)
#
# Reproduces the full core build from scratch on a macOS runner:
#   1. check out this scaffold repo,
#   2. check out upstream chen08209/concord at the PINNED commit below
#      into ./upstream (never a moving branch — the patches in patches/
#      are diffs against exactly this commit),
#   3. apply patches/ in order (01 bins/ios, 02 packet channel,
#      03 tun wrap fix),
#   4. build the FULL Concord staticlib for aarch64-apple-ios — no
#      feature trimming: bins/ios depends on the same workspace crates as
#      bins/android with default features on (engine default `mitm`,
#      mitm default `script`). If BoringSSL / aws-lc-sys / rquickjs
#      cannot build for the iphoneos SDK, this job FAILS LOUDLY; that is
#      the intended first gate, not something to work around by trimming.
#   5. verify the .a exists and is arm64,
#   6. archive the Xcode app (unsigned) with the staticlib linked.
#
# ASSUMPTION (app-link step): the staticlib is exposed at
#   upstream/target/aarch64-apple-ios/release/libconcord_ios.a
# and the Xcode project links it via the LIBRARY_SEARCH_PATHS /
# OTHER_LDFLAGS build settings passed on the xcodebuild command line
# below. The Swift-side pbxproj wiring must ALSO link both
# libconcord_ios.a and the wrapper libconcord_ios_ffi.a into the
# PacketTunnel target (OTHER_LDFLAGS -lconcord_ios -lconcord_ios_ffi);
# until that wiring lands, the archive step below is the part most
# likely to fail — the staticlib-build steps above it are the gate that
# matters first. The wrapper .a is built in the "Build Rust FFI wrapper"
# step so both search paths exist at archive time.
#
# This workflow has NOT been run yet: no Xcode / Apple SDK exists on the
# Linux VM where it was written. The first green run on macos-latest is
# the proof that the iOS staticlib build works at all.
name: iOS core check

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'rust/concord-ios-ffi/**'
      - '.github/workflows/ios-core-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'patches/**'
      - 'rust/concord-ios-ffi/**'
      - '.github/workflows/ios-core-check.yml'
  workflow_dispatch:

env:
  UPSTREAM_REPO: chen08209/concord
  # Pinned upstream commit the patches in patches/ are diffs against.
  # Change this ONLY together with regenerating patches/ (see
  # patches/README.md); never point it at a branch.
  UPSTREAM_REF: 5f1d0903775f5606bfa938cc0bbfedc25031ed6a
  XCODE_PROJECT: ConcordiOS.xcodeproj
  APP_SCHEME: ConcordiOS
  STATICLIB_DIR: upstream/target/aarch64-apple-ios/release
  STATICLIB: upstream/target/aarch64-apple-ios/release/libconcord_ios.a
  FFI_LIB_DIR: rust/concord-ios-ffi/target/aarch64-apple-ios/release

jobs:
  ios-core:
    name: Build Concord staticlib + unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout scaffold repo
        uses: actions/checkout@v4

      - name: Checkout upstream Concord at pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      - name: Apply patches in order
        run: |
          cd upstream
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ env.UPSTREAM_REF }}" || {
            echo "upstream checkout is not at the pinned commit; patches are diffs against ${{ env.UPSTREAM_REF }}"
            exit 1
          }
          for p in ../patches/*.patch; do
            echo "=== applying $p ==="
            git apply "$p" || exit 1
          done
          git status --short

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Rust targets for iOS
        run: |
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Build Concord staticlib (full workspace, no trimming)
        working-directory: upstream
        run: |
          # Upstream pins its toolchain (rust-toolchain.toml, channel
          # 1.99.0) and that toolchain does NOT list aarch64-apple-ios
          # among its targets, so entering upstream/ switches rustup to
          # 1.99.0 and the target installed for the default toolchain
          # does not apply. Install it for the pinned toolchain here.
          rustup target add aarch64-apple-ios
          # Fails loudly if BoringSSL / aws-lc-sys / rquickjs cannot
          # build for the iphoneos SDK — that failure is the gate.
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path) --target=arm64-apple-ios"
          cargo build --release --target aarch64-apple-ios -p concord-ios

      - name: Verify staticlib is arm64
        run: |
          test -f "$STATICLIB" || { echo "missing $STATICLIB"; exit 1; }
          ls -lh "$STATICLIB"
          lipo -info "$STATICLIB"
          lipo -info "$STATICLIB" | grep -q "arm64" || {
            echo "libconcord_ios.a does not contain arm64"
            exit 1
          }

      - name: Upload staticlib
        uses: actions/upload-artifact@v4
        with:
          name: libconcord_ios
          path: ${{ env.STATICLIB }}
          retention-days: 7

      - name: Build Rust FFI wrapper
        working-directory: rust/concord-ios-ffi
        run: cargo build --release --target aarch64-apple-ios

      - name: Archive (unsigned) with staticlib linked
        run: |
          # See the header comment: the staticlib is linked via the
          # command-line search path / -l flags below. The pbxproj must
          # also link libconcord_ios.a + libconcord_ios_ffi.a into the
          # PacketTunnel target; if the archive fails with undefined
          # symbols for concord_start / concord_ios_*, that wiring is
          # what is missing — not the staticlib build above.
          # NOTE on quoting: `\$(inherited)` must reach xcodebuild
          # literally (it expands the setting itself); an unescaped
          # `$(inherited)` would make bash run `inherited` as a command.
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ConcordiOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            "LIBRARY_SEARCH_PATHS=\$(inherited) $PWD/$STATICLIB_DIR $PWD/$FFI_LIB_DIR" \
            "OTHER_LDFLAGS=\$(inherited) -lconcord_ios -lconcord_ios_ffi" \
            archive

      - name: Export unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ConcordiOS.xcarchive/Products/Applications/ConcordiOS.app build/Payload/
          cd build && zip -r ConcordiOS-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ConcordiOS-unsigned-core-check
          path: build/ConcordiOS-unsigned.ipa
          retention-days: 7
