# Concord iOS — GitHub Actions build
# Runs on macOS runners because iOS builds need Xcode / iOS SDK.
# Builds the REAL Concord core: upstream Vialibrex/concord is checked
# out at the pinned commit below, patches/ are applied, and the full
# staticlib is built for aarch64-apple-ios and linked into the app.
name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  XCODE_PROJECT: ConcordiOS.xcodeproj
  APP_SCHEME: ConcordiOS
  # TODO: replace with your real Bundle IDs / Team ID after verifying signing.
  APP_BUNDLE_ID: com.sunny-qwe.concord-ios
  TUNNEL_BUNDLE_ID: com.sunny-qwe.concord-ios.PacketTunnel
  UPSTREAM_REPO: Vialibrex/concord
  # Pinned upstream commit the patches in patches/ are diffs against.
  UPSTREAM_REF: d9abaade13848e844230fad7868c2b9defcf3523
  CONCORD_PRODUCT_NAME: FlClash
  STATICLIB_DIR: upstream/target/aarch64-apple-ios/release
  STATICLIB: upstream/target/aarch64-apple-ios/release/libconcord_ios.a
  FFI_LIB_DIR: rust/concord-ios-ffi/target/aarch64-apple-ios/release

jobs:
  unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Verify unified-delay RPC encoding
        run: python3 tools/test_unified_delay.py

      - name: Install Rust targets for iOS
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version
          cargo --version

      - name: Checkout upstream Concord at pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      - name: Apply patches in order
        run: |
          cd upstream
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ env.UPSTREAM_REF }}" || {
            echo "upstream checkout is not at the pinned commit; patches are diffs against ${{ env.UPSTREAM_REF }}"
            exit 1
          }
          for p in ../patches/*.patch; do
            echo "=== applying $p ==="
            git apply "$p" || exit 1
          done
          git status --short

      - name: Install CA certificates (upstream bundle is empty)
        working-directory: upstream
        run: |
          # The pinned upstream tree ships assets/ca-certificates.crt
          # empty (see THIRD_PARTY_NOTICES.md); upstream CI fills it
          # from curl.se before building. Without it the iOS core's
          # trust store is empty and every TLS handshake fails with
          # UnknownIssuer (delay test, provider fetches, geo updates).
          bundle="$RUNNER_TEMP/ca/cacert-2026-09-25.pem"
          if [ ! -f "$bundle" ]; then
            mkdir -p "$RUNNER_TEMP/ca"
            curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/cacert-2026-09-25.pem"
          fi
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -
          cp "$bundle" assets/ca-certificates.crt
          ls -la assets/ca-certificates.crt

      - name: Build Concord staticlib (full workspace, no trimming)
        working-directory: upstream
        run: |
          # Upstream pins its toolchain (rust-toolchain.toml, channel
          # 1.99.0) without aarch64-apple-ios in its targets; install
          # the target for the pinned toolchain here (see unsigned job).
          rustup target add aarch64-apple-ios
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path) --target=arm64-apple-ios"
          cargo build --release --target aarch64-apple-ios -p concord-ios

      - name: Build Rust FFI wrapper
        working-directory: rust/concord-ios-ffi
        run: cargo build --release --target aarch64-apple-ios

      - name: Archive (unsigned)
        run: |
          # CODE_SIGNING_ALLOWED=NO alone is not enough: with
          # CODE_SIGN_STYLE=Automatic Xcode still demands a development
          # team and fails with "Signing for ... requires a development
          # team". Force manual signing with no identity for the
          # unsigned archive.
          # NOTE on quoting: `\$(inherited)` must reach xcodebuild
          # literally (it expands the setting itself).
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ConcordiOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            "LIBRARY_SEARCH_PATHS=\$(inherited) $PWD/$STATICLIB_DIR $PWD/$FFI_LIB_DIR" \
            "OTHER_LDFLAGS=\$(inherited) -lconcord_ios -lconcord_ios_ffi" \
            archive

      - name: Ad-hoc sign with entitlements (for re-signers like SideKite)
        run: bash tools/adhoc-sign.sh build/ConcordiOS.xcarchive/Products/Applications/ConcordiOS.app
      - name: Export unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ConcordiOS.xcarchive/Products/Applications/ConcordiOS.app build/Payload/
          cd build && zip -r ConcordiOS-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ConcordiOS-unsigned
          path: build/ConcordiOS-unsigned.ipa
          retention-days: 7

  signed-ipa:
    name: Build signed IPA
    # GitHub does not allow the `secrets` context in a job-level `if:`,
    # so the secret check is done in the first step instead (step-level
    # `if:` can use step outputs). The job is skipped step-by-step when
    # any secret is missing.
    runs-on: macos-latest
    needs: unsigned-ipa
    steps:
      - name: Check signing secrets
        id: check
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_APP: ${{ secrets.IOS_MOBILEPROVISION_APP }}
          IOS_MOBILEPROVISION_TUNNEL: ${{ secrets.IOS_MOBILEPROVISION_TUNNEL }}
        run: |
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_P12_PASSWORD" ] && [ -n "$IOS_MOBILEPROVISION_APP" ] && [ -n "$IOS_MOBILEPROVISION_TUNNEL" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are missing; skipping signed build."
          fi

      - name: Checkout
        if: steps.check.outputs.has_secrets == 'true'
        uses: actions/checkout@v4

      - name: Select Xcode
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Verify unified-delay RPC encoding
        if: steps.check.outputs.has_secrets == 'true'
        run: python3 tools/test_unified_delay.py

      - name: Install Rust targets for iOS
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Checkout upstream Concord at pinned commit
        if: steps.check.outputs.has_secrets == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      - name: Apply patches in order
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          cd upstream
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ env.UPSTREAM_REF }}" || {
            echo "upstream checkout is not at the pinned commit; patches are diffs against ${{ env.UPSTREAM_REF }}"
            exit 1
          }
          for p in ../patches/*.patch; do
            echo "=== applying $p ==="
            git apply "$p" || exit 1
          done
          git status --short

      - name: Install CA certificates (upstream bundle is empty)
        if: steps.check.outputs.has_secrets == 'true'
        working-directory: upstream
        run: |
          # The pinned upstream tree ships assets/ca-certificates.crt
          # empty (see THIRD_PARTY_NOTICES.md); upstream CI fills it
          # from curl.se before building. Without it the iOS core's
          # trust store is empty and every TLS handshake fails with
          # UnknownIssuer (delay test, provider fetches, geo updates).
          bundle="$RUNNER_TEMP/ca/cacert-2026-09-25.pem"
          if [ ! -f "$bundle" ]; then
            mkdir -p "$RUNNER_TEMP/ca"
            curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/cacert-2026-09-25.pem"
          fi
          echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $bundle" | sha256sum -c -
          cp "$bundle" assets/ca-certificates.crt
          ls -la assets/ca-certificates.crt

      - name: Build Concord staticlib (full workspace, no trimming)
        if: steps.check.outputs.has_secrets == 'true'
        working-directory: upstream
        run: |
          # Upstream pins its toolchain (rust-toolchain.toml, channel
          # 1.99.0) without aarch64-apple-ios in its targets; install
          # the target for the pinned toolchain here (see unsigned job).
          rustup target add aarch64-apple-ios
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path) --target=arm64-apple-ios"
          cargo build --release --target aarch64-apple-ios -p concord-ios

      - name: Build Rust FFI wrapper
        if: steps.check.outputs.has_secrets == 'true'
        working-directory: rust/concord-ios-ffi
        run: cargo build --release --target aarch64-apple-ios

      - name: Import signing certificate and profiles
        if: steps.check.outputs.has_secrets == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_APP: ${{ secrets.IOS_MOBILEPROVISION_APP }}
          IOS_MOBILEPROVISION_TUNNEL: ${{ secrets.IOS_MOBILEPROVISION_TUNNEL }}
        run: |
          # TODO: verify this matches your certificate type (Development vs
          # Distribution) and that both profiles contain packet-tunnel-provider.
          # Do NOT print secrets to logs.
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_P12_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$IOS_MOBILEPROVISION_APP" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          echo "$IOS_MOBILEPROVISION_TUNNEL" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/tunnel.mobileprovision
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm /tmp/cert.p12

      - name: Archive (signed)
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ConcordiOS.xcarchive \
            "LIBRARY_SEARCH_PATHS=\$(inherited) $PWD/$STATICLIB_DIR $PWD/$FFI_LIB_DIR" \
            "OTHER_LDFLAGS=\$(inherited) -lconcord_ios -lconcord_ios_ffi" \
            archive

      - name: Export signed IPA
        if: steps.check.outputs.has_secrets == 'true'
        run: |
          # ExportOptions.plist is a TEMPLATE in the repo root.
          # Before this job can succeed you MUST replace YOUR_TEAM_ID and
          # the two YOUR_*_PROVISIONING_PROFILE_NAME placeholders in it
          # with your real Team ID / profile names (see SIGNING.md).
          # The profile names must match the two .mobileprovision files
          # imported above, and both profiles must contain
          # packet-tunnel-provider. This step has NOT been verified on a
          # Mac / in Xcode yet; if the export fails with a manual-signing
          # error, the archive step and project.pbxproj (currently
          # CODE_SIGN_STYLE = Automatic) must be switched to Manual first.
          xcodebuild -exportArchive \
            -archivePath build/ConcordiOS.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist
          ls -R build/export
          # xcodebuild names the exported file after the app; normalise it
          # to the path the upload step expects.
          find build/export -name "*.ipa" -print -exec cp {} build/ConcordiOS-signed.ipa \;
          ls -lh build/ConcordiOS-signed.ipa

      - name: Upload signed IPA
        if: steps.check.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ConcordiOS-signed
          path: build/ConcordiOS-signed.ipa
          retention-days: 7
