# Concord iOS — GitHub Actions build
# Runs on macOS runners because iOS builds need Xcode / iOS SDK.
# This workflow does NOT run on Linux and has NOT been verified yet.
# First goal: get the unsigned-ipa job green. Signing comes second.
name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  XCODE_PROJECT: ConcordiOS.xcodeproj
  APP_SCHEME: ConcordiOS
  # TODO: replace with your real Bundle IDs / Team ID after verifying signing.
  APP_BUNDLE_ID: com.sunny-qwe.concord-ios
  TUNNEL_BUNDLE_ID: com.sunny-qwe.concord-ios.PacketTunnel

jobs:
  unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Rust targets for iOS
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version
          cargo --version

      - name: Build Rust staticlib placeholder
        working-directory: rust/concord-ios-ffi
        run: |
          # TODO: this builds the FFI *stub* only. The real Concord
          # staticlib wiring goes here once its iOS entry point is defined.
          # BoringSSL under the iphoneos SDK is unverified — see rust/concord-ios-ffi/README.md
          cargo build --release --target aarch64-apple-ios

      - name: Archive (unsigned)
        run: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ConcordiOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ConcordiOS.xcarchive/Products/Applications/ConcordiOS.app build/Payload/
          cd build && zip -r ConcordiOS-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ConcordiOS-unsigned
          path: build/ConcordiOS-unsigned.ipa
          retention-days: 7

  signed-ipa:
    name: Build signed IPA
    # Only runs when all signing secrets are present.
    # The job is skipped (not failed) if any secret is missing.
    if: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_P12_PASSWORD != '' && secrets.IOS_MOBILEPROVISION_APP != '' && secrets.IOS_MOBILEPROVISION_TUNNEL != '' }}
    runs-on: macos-latest
    needs: unsigned-ipa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Rust targets for iOS
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build Rust staticlib placeholder
        working-directory: rust/concord-ios-ffi
        run: cargo build --release --target aarch64-apple-ios

      - name: Import signing certificate and profiles
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_APP: ${{ secrets.IOS_MOBILEPROVISION_APP }}
          IOS_MOBILEPROVISION_TUNNEL: ${{ secrets.IOS_MOBILEPROVISION_TUNNEL }}
        run: |
          # TODO: verify this matches your certificate type (Development vs
          # Distribution) and that both profiles contain packet-tunnel-provider.
          # Do NOT print secrets to logs.
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_P12_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$IOS_MOBILEPROVISION_APP" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          echo "$IOS_MOBILEPROVISION_TUNNEL" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/tunnel.mobileprovision
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm /tmp/cert.p12

      - name: Archive (signed)
        run: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ConcordiOS.xcarchive \
            archive

      - name: Export signed IPA
        run: |
          # ExportOptions.plist is a TEMPLATE in the repo root.
          # Before this job can succeed you MUST replace YOUR_TEAM_ID and
          # the two YOUR_*_PROVISIONING_PROFILE_NAME placeholders in it
          # with your real Team ID / profile names (see SIGNING.md).
          # The profile names must match the two .mobileprovision files
          # imported above, and both profiles must contain
          # packet-tunnel-provider. This step has NOT been verified on a
          # Mac / in Xcode yet; if the export fails with a manual-signing
          # error, the archive step and project.pbxproj (currently
          # CODE_SIGN_STYLE = Automatic) must be switched to Manual first.
          xcodebuild -exportArchive \
            -archivePath build/ConcordiOS.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist
          ls -R build/export
          # xcodebuild names the exported file after the app; normalise it
          # to the path the upload step expects.
          find build/export -name "*.ipa" -print -exec cp {} build/ConcordiOS-signed.ipa \;
          ls -lh build/ConcordiOS-signed.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: ConcordiOS-signed
          path: build/ConcordiOS-signed.ipa
          retention-days: 7
